<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">

  </head>
  <body>
    <p class="result-display result"></p>

    <p>
      <button onclick="
        updateCalculation('1');
      " class="number-buttons calculator-button">1</button>

      <button onclick="
        updateCalculation('2');
      " class="number-buttons calculator-button">2</button>

      <button onclick="
        updateCalculation('3');
      " class="number-buttons calculator-button">3</button>

      <button onclick="
        updateCalculation(' + ');
      " class="calculator-button symbol-button">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      " class="number-buttons calculator-button">4</button>

      <button onclick="
        updateCalculation('5');
      " class="number-buttons calculator-button">5</button>

      <button onclick="
        updateCalculation('6');
      " class="number-buttons calculator-button">6</button>

      <button onclick="
        updateCalculation(' - ');
      " class="calculator-button symbol-button
      ">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      " class="number-buttons calculator-button">7</button>

      <button onclick="
        updateCalculation('8');
      " class="number-buttons calculator-button">8</button>

      <button onclick="
        updateCalculation('9');
      " class="number-buttons calculator-button">9</button>

      <button onclick="
        updateCalculation(' * ');
      " class="calculator-button symbol-button">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      " class="number-buttons calculator-button">0</button>

      <button onclick="
        updateCalculation('.');
      " class="number-buttons calculator-button">.</button>
      
      <button onclick="
        calculation = eval(calculation);
        displayResult();
        localStorage.setItem('calculation',   calculation);
      " class="number-buttons calculator-button">=</button>

      <button onclick="
        updateCalculation(' / ');
      " class="calculator-button symbol-button">/</button>
    </p>

    <p>
      <button onclick="
        calculation = '';
        localStorage.setItem('calculation', calculation);
        displayResult();
      " class="number-buttons calculator-button clear-button">Clear</button>
    </p>

    <script src="script.js"></script>
  </body>
</html>
